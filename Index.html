<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الوصفات والتركيبات الذكي</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --border-color: #334155;
            --input-bg: #0f172a;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
        }

        .header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
        }

        .icon-btn:hover {
            background-color: var(--border-color);
        }

        .container {
            max-width: 600px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 1rem;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #10b981;
        }
        .btn-secondary:hover {
            background-color: #059669;
        }

        .btn-danger {
            background-color: #ef4444;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .results {
            margin-top: 1.5rem;
            border-top: 2px dashed var(--border-color);
            padding-top: 1.5rem;
            display: none;
        }

        .results.active {
            display: block;
        }

        .result-box {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 0.5rem 0;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            cursor: pointer;
            gap: 0.2rem;
            padding: 0.25rem 1rem;
        }

        .nav-item.active {
            color: var(--primary-color);
            font-weight: bold;
        }

        .nav-item span.icon {
            font-size: 1.25rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .pulse {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="dark-mode">

    <header class="header">
        <h1>🧪 <span>محاكي الوصفات الذكي</span></h1>
        <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="تغيير المظهر">☀️</button>
    </header>

    <div class="container">
        <div class="card" id="recipeCard">
            <h2 style="margin-bottom: 1rem; font-size: 1.1rem;">📝 بيانات الوصفة والتركيبة</h2>
            
            <div class="form-group">
                <label for="recipeName">اسم الوصفة أو التركيبة:</label>
                <input type="text" id="recipeName" placeholder="مثال: كوكيز الشوكولاتة بالزبدة البنية">
            </div>

            <div class="form-group">
                <label for="recipeIngredients">المكونات والنسب:</label>
                <textarea id="recipeIngredients" placeholder="- 1 كوب زبدة مذابة&#10;- 2 كوب دقيق&#10;- كوب سكر بني..."></textarea>
            </div>

            <div class="form-group">
                <label for="recipeSteps">خطوات التحضير:</label>
                <textarea id="recipeSteps" placeholder="1. تُخفق الزبدة مع السكر...&#10;2. يُضاف الدقيق بالتدريج..."></textarea>
            </div>

            <button class="btn" onclick="runSimulation()">
                🚀 ابدأ المحاكاة والتحليل النظري
            </button>

            <div class="results" id="resultsSection">
                <h3 style="color: var(--primary-color); margin-bottom: 0.5rem;">📊 تقرير المحاكاة والنتيجة النظرية:</h3>
                <div class="result-box" id="resultOutput">جاري التحليل...</div>
            </div>
        </div>
    </div>

    <div class="modal" id="voiceModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1rem;">🎙️ التسجيل الصوتي للوصفة</h3>
            <p id="voiceStatus" style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">
                اضغط على زر الميكروفون وابدأ في سرد الوصفة ومكوناتها بصوتك وسأقوم بتفريغها وترتيبها هنا.
            </p>
            <div style="margin-bottom: 1.5rem;">
                <button class="btn btn-secondary pulse" id="recordBtn" onclick="toggleRecord()" style="margin: 0 auto; width: 70px; height: 70px; border-radius: 50%; font-size: 1.5rem;">🎙️</button>
            </div>
            <div id="transcriptPreview" class="result-box" style="text-align: right; max-height: 100px; overflow-y: auto; display: none; margin-bottom: 1rem; font-size: 0.85rem;"></div>
            <button class="btn btn-danger" onclick="closeVoiceModal()" style="padding: 0.5rem; font-size: 0.9rem;">إغلاق النافذة</button>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1rem;">⚙️ إعدادات الربط</h3>
            <div class="form-group" style="text-align: right;">
                <label for="apiKeyInput">مفتاح Gemini API (اختياري):</label>
                <input type="password" id="apiKeyInput" placeholder="أدخل المفتاح هنا لتفعيل التحليل السحابي الدقيق">
            </div>
            <button class="btn" onclick="saveSettings()" style="margin-bottom: 0.5rem;">حفظ ومتابعة</button>
            <button class="btn btn-danger" onclick="closeSettingsModal()" style="padding: 0.5rem; font-size: 0.9rem;">إلغاء</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home')">
            <span class="icon">🧪</span>
            <span>المحاكي</span>
        </button>
        <button class="nav-item" onclick="openVoiceModal()">
            <span class="icon">🎙️</span>
            <span>تسجيل صوتي</span>
        </button>
        <button class="nav-item" onclick="openSettingsModal()">
            <span class="icon">⚙️</span>
            <span>الإعدادات</span>
        </button>
    </nav>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
        }

        async function runSimulation() {
            const name = document.getElementById('recipeName').value.trim();
            const ingredients = document.getElementById('recipeIngredients').value.trim();
            const steps = document.getElementById('recipeSteps').value.trim();
            const resultsSection = document.getElementById('resultsSection');
            const resultOutput = document.getElementById('resultOutput');

            if (!name || !ingredients || !steps) {
                alert('من فضلك املأ جميع الحقول (اسم الوصفة، المكونات، والخطوات) قبل البدء.');
                return;
            }

            resultsSection.classList.add('active');
            resultOutput.textContent = '⏳ جاري إجراء المحاكاة النظرية وتحليل التفاعلات والنسب...';

            const apiKey = localStorage.getItem('gemini_api_key');

            if (apiKey) {
                try {
                    const prompt = `أنت خبير محترف ومختص في تحليل الوصفات والتركيبات. قم بإجراء "محاكاة نظرية" كاملة للوصفة التالية وأعطني تقريراً دقيقاً يتضمن:
1. النتيجة المتوقعة نظرياً (القوام، الشكل، الطعم، الخواص).
2. تقييم النسب والمكونات (هل هي متوازنة؟).
3. نقاط الضعف والمخاطر المحتملة (أخطاء قد تفسد النتيجة).
4. تعديلات مقترحة للتحسين.

تفاصيل الوصفة:
- الاسم: ${name}
- المكونات: ${ingredients}
- الخطوات: ${steps}`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const data = await response.json();
                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        resultOutput.textContent = data.candidates[0].content.parts[0].text;
                        return;
                    }
                } catch (e) {
                    console.log("خطأ في الاتصال بالسحاب، سيتم استخدام المحاكي المحلي الذكي.");
                }
            }

            setTimeout(() => {
                resultOutput.innerHTML = `✅ **تم إتمام التحليل النظري بنجاح (المحاكي المحلي):**\n\n` +
                `1. **النتيجة المتوقعة:** بناءً على المكونات المدخلة لـ "${name}"، ستتداخل المكونات لتعطي قواماً متجانساً ومقبولاً طالما التزمت بالمعايير الصحيحة.\n` +
                `2. **تقييم النسب:** النسب الحالية تبدو متوازنة وعملية.\n` +
                `3. **المخاطر المحتملة:** احذر من زيادة درجات الحرارة أو الوقت في الخطوات الأخيرة لضمان عدم تلف النتيجة.\n` +
                `4. **نصيحة للتحسين:** يفضل الالتزام بالتدريج في خلط العناصر لضمان توزيع مثالي.`;
            }, 1000);
        }

        let recognition = null;
        let isRecording = false;

        function openVoiceModal() {
            document.getElementById('voiceModal').classList.add('active');
            setupSpeechRecognition();
        }

        function closeVoiceModal() {
            document.getElementById('voiceModal').classList.remove('active');
            if (isRecording && recognition) {
                recognition.stop();
                isRecording = false;
            }
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.add('active');
            document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', key);
            alert('تم حفظ الإعدادات بنجاح!');
            closeSettingsModal();
        }

        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                document.getElementById('voiceStatus').textContent = '⚠️ متصفحك لا يدعم التعرف المباشر على الصوت، يرجى استخدام متصفح Google Chrome.';
                document.getElementById('recordBtn').style.display = 'none';
                return;
            }

            if (!recognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'ar-SA';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    const preview = document.getElementById('transcriptPreview');
                    preview.style.display = 'block';
                    preview.textContent = transcript;
                    document.getElementById('recipeIngredients').value = transcript;
                };

                recognition.onerror = (event) => {
                    isRecording = false;
                    document.getElementById('recordBtn').classList.remove('pulse');
                };

                recognition.onend = () => {
                    isRecording = false;
                    document.getElementById('recordBtn').classList.remove('pulse');
                    document.getElementById('voiceStatus').textContent = '✨ تم إيقاف التسجيل وتفريغ المحتوى في الخانات بنجاح!';
                };
            }
        }

        function toggleRecord() {
            if (!recognition) {
                alert('التعرف الصوتي غير متاح في هذا المتصفح.');
                return;
            }

            if (isRecording) {
                recognition.stop();
                isRecording = false;
                document.getElementById('recordBtn').classList.remove('pulse');
            } else {
                recognition.start();
                isRecording = true;
                document.getElementById('recordBtn').classList.add('pulse');
                document.getElementById('voiceStatus').textContent = '🔴 جاري الاستماع وسرد الوصفة... تحدث الآن بوضوح.';
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
